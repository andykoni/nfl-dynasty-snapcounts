<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Dynasty Snap Dashboard</title>
<style>
:root{
  --bg:#f3f5f8;--surface:#fff;--surface-soft:#f8fafc;--text:#182233;
  --muted:#69758a;--border:#e2e7ef;--navy:#182338;--blue:#356fe5;
  --green:#16845b;--red:#c44343;--shadow:0 8px 28px rgba(24,34,51,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
button,input,select{font:inherit}
.top{background:linear-gradient(135deg,#111a2b 0%,#1c2940 100%);color:#fff;padding:30px 34px}
.topin{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:18px}
.top h1{margin:0;font-size:27px;letter-spacing:-.02em}.top p{margin:4px 0 0;color:#aeb9cb;font-size:14px}
.live{background:rgba(26,154,101,.16);border:1px solid rgba(107,224,169,.28);color:#a9edca;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.wrap{max-width:1280px;margin:auto;padding:26px 34px 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.big{font-size:29px;font-weight:800;letter-spacing:-.03em;margin-top:5px}
.controls{margin:22px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
button,select,input{border:1px solid #d6dde8;background:#fff;border-radius:9px;padding:9px 12px;color:var(--text);outline:none}
button{cursor:pointer !important;font-weight:650;transition:all .15s ease;user-select:none}
button:hover{background:#f1f4f8;border-color:#c4cedd;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 8px rgba(24,35,56,.2)}
select,input{cursor:pointer !important}
input{cursor:text}.search{margin-left:auto;width:220px}.search::placeholder{color:#9aa5b6}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{background:var(--surface-soft);text-align:left;color:#6e7a8f;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:12px 14px;font-weight:750}
td{padding:14px;border-top:1px solid #edf0f4;font-size:13.5px}
tbody tr{transition:background .12s ease}tbody tr:hover{background:#fafbfd}
th:nth-child(n+5),td:nth-child(n+5){text-align:right}
.tag{font-size:10.5px;background:#eef2f7;color:#536176;border-radius:5px;padding:3px 7px;font-weight:700}
.player{display:flex;flex-direction:column;gap:2px}.player b{font-size:14px}.player span{font-size:11px;color:var(--muted)}
.snap{font-variant-numeric:tabular-nums;font-weight:650}.pct{font-weight:800;font-variant-numeric:tabular-nums}
.bar{width:90px;height:6px;background:#e8edf3;border-radius:99px;display:inline-block;vertical-align:middle;margin-left:9px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:99px}
.up{color:var(--green);font-weight:750}.down{color:var(--red);font-weight:750}
.footer{color:#7a8597;font-size:12px;margin-top:14px}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:18px}.top{padding:22px 18px}.topin{align-items:flex-start}.search{margin-left:0;width:100%}.controls{flex-wrap:wrap}.bar{display:none}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.big{font-size:24px}table{min-width:760px}.panel{overflow-x:auto}}

.league-pill{display:inline-block;background:#eef3ff;color:#315fb5;border:1px solid #d8e4ff;border-radius:6px;padding:3px 7px;margin:2px 2px;font-size:10.5px;font-weight:750}
</style></head>
<body>
<div class="top"><div class="topin"><div><h1>NFL Dynasty Snap Dashboard</h1><div class="sub">Current MFL rosters × NFL snap usage</div></div><div class="live">● CURRENT ROSTER</div></div></div>
<div class="wrap">
<div class="cards">
<div class="card"><div class="small">Current players</div><div class="big" id="players">—</div></div>
<div class="card"><div class="small">Rising roles</div><div class="big" id="rising">—</div></div>
<div class="card"><div class="small">Falling roles</div><div class="big" id="falling">—</div></div>
<div class="card"><div class="small">Leagues</div><div class="big" id="leagueCount">—</div></div>
<div class="card"><div class="small">Latest week</div><div class="big" id="week">—</div></div>
</div>
<div class="controls">
<button class="active" type="button" data-unit="All" title="Show all players">All players</button><button type="button" data-unit="Offense" title="Show offensive players">Offense</button><button type="button" data-unit="IDP" title="Show IDP players">IDP</button>
<select id="league"><option>All leagues</option></select><select id="pos"><option>All positions</option></select><input class="search" id="search" placeholder="Search player…">
</div>
<div class="panel"><table><thead><tr><th>Player</th><th>Pos</th><th>NFL</th><th>League(s)</th><th>Snaps</th><th>Snap %</th><th>Trend</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer" id="footer"></div>
</div>
<script>
fetch('data.json?'+Date.now()).then(r=>r.json()).then(D=>{
const league=document.getElementById('league'),pos=document.getElementById('pos');
D.leagues.forEach(x=>{let o=document.createElement('option');o.textContent=x;league.appendChild(o)});
[...new Set(D.current.map(x=>x.position))].sort().forEach(x=>{let o=document.createElement('option');o.textContent=x;pos.appendChild(o)});
document.getElementById('players').textContent=D.current.length;
document.getElementById('rising').textContent=D.current.filter(x=>x.trend>0).length;
document.getElementById('falling').textContent=D.current.filter(x=>x.trend<0).length;
document.getElementById('leagueCount').textContent=D.leagues.length;
document.getElementById('week').textContent='Week '+D.week;
document.getElementById('footer').textContent=(D.status||'Live')+' · Last data refresh: '+D.updated_at;
let unit='All';
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');unit=b.dataset.unit;render()});
[league,pos,document.getElementById('search')].forEach(x=>x.oninput=render);
function render(){let q=document.getElementById('search').value.toLowerCase(),l=league.value,p=pos.value;
let a=D.current.filter(x=>(unit==='All'||x.unit===unit)&&(!l||l==='All leagues'||x.leagues.includes(l))&&(!p||p==='All positions'||x.position===p)&&x.player.toLowerCase().includes(q));
document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><div class="player"><b>${x.player}</b><span>${x.unit}</span></div></td><td><span class="tag">${x.position}</span></td><td>${x.team}</td><td>${x.leagues.join(', ')}</td><td>${x.snaps??'—'}</td><td>${x.pct==null?'—':`<b>${x.pct.toFixed(1)}%</b><span class="bar"><span class="fill" style="display:block;width:${Math.min(100,x.pct)}%"></span></span>`}</td><td class="${x.trend>0?'up':x.trend<0?'down':''}">${x.trend>0?'↑ Rising':x.trend<0?'↓ Falling':'→'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No current players match these filters.</td></tr>'}
render()});
</script></body></html>
